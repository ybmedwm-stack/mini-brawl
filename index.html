<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mini Brawl</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600;800&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen arcade cabinet on a game table. Canvas arena on top, thumb controls pinned to the bottom corners, roster as an overlay. Single dark look by choice. */
:root{
  --felt:#12261f; --felt-2:#1c3a2f; --ink:#0b1512; --parch:#efe2c2; --parch-dim:#b9ad8f;
  --gold:#e0aa3e; --plum:#8a4bb3; --blood:#d2492f;
  --display:'Grenze Gotisch','Palatino Linotype',Georgia,serif;
  --body:'Alegreya Sans','Trebuchet MS',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
*{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
img{max-width:100%}
body{background:var(--ink);color:var(--parch);font-family:var(--body);font-size:16px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#stage{height:100%;display:flex;flex-direction:column;align-items:center;gap:8px;padding-inline:0}
#cv{display:block;background:var(--felt);touch-action:none}
#legend{color:var(--parch-dim);font-size:14px;text-align:center;padding-inline:16px;line-height:1.5}
#legend b{color:var(--parch);font-weight:700}
kbd{font-family:var(--body);background:var(--felt-2);border:1px solid #2f5a49;border-bottom-width:2px;border-radius:4px;padding:0 6px;color:var(--parch)}
#quit{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);left:50%;transform:translateX(-50%);z-index:3;
  background:rgba(11,21,18,.7);color:var(--parch-dim);border:1px solid #2f5a49;border-radius:4px;font:500 13px var(--body);padding:3px 10px;cursor:pointer}
/* touch pad */
#pad{display:none;position:fixed;inset:auto 0 0 0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 14px);justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:2}
#pad .grp{display:grid;gap:10px;pointer-events:auto}
#pad .mv{grid-template-columns:repeat(2,64px)}
#pad .act{grid-template-columns:repeat(2,64px)}
.tb{width:64px;height:64px;border-radius:50%;border:2px solid rgba(239,226,194,.55);background:rgba(11,21,18,.55);color:var(--parch);
  font:700 13px var(--body);letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;touch-action:none}
.tb.on{background:rgba(224,170,62,.55);border-color:var(--gold)}
.tb.sp{border-color:var(--plum);color:#e3c8f5}
.tb.at{border-color:var(--blood)}
.tb.big{font-size:24px}
@media (hover:none),(pointer:coarse){#pad{display:flex}#legend{display:none}}
/* overlays */
.ov{position:fixed;inset:0;z-index:5;background:radial-gradient(ellipse at 50% 0%,var(--felt-2),var(--ink) 70%);overflow-y:auto;touch-action:pan-y;
  padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 20px);padding-inline:16px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font:800 clamp(40px,9vw,68px)/.9 var(--display);margin:0;color:var(--gold);letter-spacing:.01em;text-shadow:0 3px 0 #5a2d12}
.sub{color:var(--parch-dim);margin:0;max-width:60ch}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid #2f5a49;border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--parch-dim);font:700 14px var(--body);padding:8px 14px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--gold);color:var(--ink)}
.slots{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.slot{min-width:0;display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.25);border:2px solid #2f5a49;border-radius:8px;padding:8px;cursor:pointer;color:inherit;font:inherit;text-align:left}
.slot.active{border-color:var(--gold);box-shadow:0 0 0 3px rgba(224,170,62,.2)}
.slot img{height:72px;width:56px;object-fit:contain;flex:none}
.slot .q{height:72px;width:56px;flex:none;display:flex;align-items:center;justify-content:center;font:800 44px var(--display);color:var(--parch-dim)}
.slot small{display:block;color:var(--gold);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.slot span{min-width:0}
.slot strong{font:600 20px/1 var(--display);display:block;overflow-wrap:anywhere}
.vs{align-self:center;font:800 28px var(--display);color:var(--blood)}
.grid{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}
@media (max-width:640px){.grid{grid-template-columns:repeat(5,1fr)}}
.pick{background:linear-gradient(#24483b,#152c24);border:2px solid #2f5a49;border-radius:8px;padding:6px 2px 0;cursor:pointer;aspect-ratio:3/4;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.pick img{max-height:100%;max-width:100%;object-fit:contain;pointer-events:none}
.pick:hover,.pick:focus-visible{border-color:var(--parch);outline:none}
.pick.p1{border-color:var(--gold)}.pick.p2{border-color:var(--blood)}.pick.p1.p2{border-color:var(--gold) var(--blood) var(--blood) var(--gold)}
#info{background:rgba(0,0,0,.25);border-left:3px solid var(--plum);padding:10px 14px;display:flex;flex-direction:column;gap:6px}
#info h2{font:600 26px/1 var(--display);margin:0}
#info p{margin:0;color:var(--parch-dim)}
#info p b{color:#e3c8f5}
.stats{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;align-items:center;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--parch-dim);max-width:320px}
.bar{height:7px;background:#0b1512;border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.go{background:var(--blood);color:#fff5e6;border:0;border-bottom:4px solid #7c2413;border-radius:8px;font:800 30px var(--display);padding:8px 34px;cursor:pointer;letter-spacing:.03em}
.go:active{transform:translateY(2px);border-bottom-width:2px}
.ghost{background:transparent;color:var(--parch);border:1px solid var(--parch-dim);border-radius:8px;font:700 15px var(--body);padding:10px 18px;cursor:pointer}
button:focus-visible{outline:2px solid var(--parch);outline-offset:2px}
#end .wrap{align-items:center;text-align:center;padding-top:8vh}
#end img{height:min(42vh,300px)}
</style>

</head><body>
<div id="stage">
  <canvas id="cv" aria-label="Fighting arena"></canvas>
  <div id="legend"></div>
</div>
<button id="quit" hidden>Quit match</button>
<div id="pad">
  <div class="grp mv">
    <div class="tb" data-k="u" style="grid-column:1/3;justify-self:center">Jump</div>
    <div class="tb big" data-k="l">◀</div><div class="tb big" data-k="r">▶</div>
  </div>
  <div class="grp act">
    <div class="tb sp" data-k="sp">Power</div><div class="tb" data-k="block">Block</div>
    <div class="tb at" data-k="atk" style="grid-column:1/3;justify-self:center;width:76px;height:76px">Hit</div>
  </div>
</div>

<div class="ov" id="menu">
  <div class="wrap">
    <div><h1>Mini Brawl</h1><p class="sub">Nine painted minis settle it on the battle mat. Best of three rounds.</p></div>
    <div class="row">
      <div class="seg" role="group" aria-label="Mode">
        <button id="m1" aria-pressed="true">1 player vs CPU</button><button id="m2" aria-pressed="false">2 players, one keyboard</button>
      </div>
      <div class="seg" role="group" aria-label="CPU skill" id="diff">
        <button data-d="0" aria-pressed="false">Easy</button><button data-d="1" aria-pressed="true">Normal</button><button data-d="2" aria-pressed="false">Hard</button>
      </div>
    </div>
    <div class="slots">
      <button class="slot active" id="s0"></button><div class="vs">VS</div><button class="slot" id="s1"></button>
    </div>
    <div class="grid" id="grid"></div>
    <div id="info"></div>
    <p id="nojs" style="margin:0;padding:10px 14px;border:1px solid var(--blood);border-radius:8px;color:var(--parch)">The game code is not running here. This viewer is showing the page without its script. Open this file in Safari or Chrome instead of a preview.</p>
    <div class="row"><button class="go" id="fight">Fight!</button></div>
  </div>
</div>
<div class="ov" id="end" hidden>
  <div class="wrap">
    <img id="endimg" alt="">
    <h1 id="endtxt"></h1>
    <div class="row" style="justify-content:center"><button class="go" id="again">Rematch</button><button class="ghost" id="back">Change fighters</button></div>
  </div>
</div>

function mk(i){const c=CH[pick[i]];return{i,c,img:IMG[c.id+'_side'],body:IMG[c.id+'_body'],rig:RIG[c.id],cast:0,x:i?W-230:230,y:0,vx:0,vy:0,face:i?-1:1,hp:c.hp,st:'idle',at:0,did:0,hit:0,cd:1.5,
  slow:0,stun:0,shield:0,spin:0,spinHit:0,slam:0,blocking:0,ko:0,cpu:mode==1&&i==1,ai:{t:0,mv:0,blk:0},in:IN[i]}}

/* ---------- audio ---------- */
function beep(f,d,type,v){if(!AC)return;try{const o=AC.createOscillator(),ga=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(30,f*.4),AC.currentTime+d);ga.gain.setValueAtTime(v||.08,AC.currentTime);ga.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
  o.connect(ga).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}

/* ---------- combat ---------- */
function say(x,y,s,col,big){txt.push({x,y,s,col:col||'#efe2c2',t:0,big})}
function hurt(t,amt,kb,dir,o){o=o||{};
  if(t.ko||phase!='fight')return false;
  if(t.shield>0){say(t.x,GY-t.c.h-10,'Warded','#e0aa3e');beep(900,.08,'triangle');return false}
  let blocked=t.blocking&&!o.unblock;
  if(blocked){amt=Math.ceil(amt*.2);kb*=.3;beep(300,.06,'triangle')}
  else{t.hit=o.nostun?0:.22;if(t.st=='attack')t.st='idle';t.spin=0;if(o.pop)t.vy=-o.pop;beep(140,.12,'sawtooth',.1)}
  t.hp-=amt;t.vx=kb*dir;shake=Math.min(12,amt*.6);
  say(t.x+(Math.random()*30-15),GY+t.y-t.c.h*.8,(blocked?'block ':'')+amt,blocked?'#b9ad8f':'#fff1d0',amt>=20);
  fx.push({k:'spark',x:t.x-dir*10,y:GY+t.y-t.c.h*.55,t:0,col:blocked?'#b9ad8f':'#ffd27a'});
  if(t.hp<=0){t.hp=0;t.ko=.001;t.vy=-320;t.vx=dir*260;endRound()}
  return !blocked}
function special(f){const o=F[1-f.i],c=f.c,cy=GY+f.y-c.h*.55;f.cd=c.cd;say(f.x,GY+f.y-c.h-14,c.sp+'!',c.col);beep(520,.25,'triangle',.1);
  switch(c.id){
   case'bard':shots.push({k:'wave',x:f.x+f.face*40,y:cy,vx:f.face*430,vy:0,o:f,life:2.2,r:26});break;
   case'tief':f.vy=-640;f.vx=f.face*Math.min(330,Math.abs(o.x-f.x)*1.1);f.slam=1;break;
   case'pal':f.shield=2.2;f.hp=Math.min(c.hp,f.hp+14);say(f.x,GY-c.h*.5,'+14','#9fe08a');break;
   case'dwarf':f.spin=1;f.spinHit=0;f.spinDir=f.face;break;
   case'druid':fx.push({k:'roots',x:o.x,t:0,o:f,done:0});break;
   case'witch':{const d=Math.max(120,Math.min(520,Math.abs(o.x-f.x)));shots.push({k:'potion',x:f.x+f.face*20,y:cy-20,vx:f.face*d/.95,vy:-560,o:f,life:3,r:16});break}
   case'pirate':shots.push({k:'raven',x:f.x+f.face*30,y:cy-50,vx:f.face*300,vy:-80,o:f,life:3.2,r:22});break;
   case'david':shots.push({k:'croc',x:f.x+f.face*50,y:GY-14,vx:f.face*400,vy:0,o:f,life:3,r:34,ground:1});break;
   case'dm':{const n=1+Math.floor(Math.random()*20);
     if(n==1){say(f.x,GY-c.h-40,'Natural 1!','#d2492f',1);f.hp=Math.max(1,f.hp-8);fx.push({k:'spark',x:f.x,y:cy,t:0,col:'#d2492f'});beep(90,.4,'sawtooth',.1)}
     else shots.push({k:'die',n,x:f.x+f.face*40,y:cy,vx:f.face*540,vy:0,o:f,life:2,r:20});break}
  }}
function endRound(){phase='ko';pt=0}
function cpu(f,dt){const o=F[1-f.i],a=f.ai,inp=f.in,d=Math.abs(o.x-f.x),dir=Math.sign(o.x-f.x)||1,sk=[.45,.75,1][diff];
  a.t-=dt;a.blk-=dt;inp.block=a.blk>0?1:0;
  if(a.t>0){inp.l=a.mv<0;inp.r=a.mv>0;return}
  a.t=[.3,.18,.1][diff]+Math.random()*.1;inp.u=0;
  const ranged=!['tief','pal','dwarf'].includes(f.c.id);
  const want=ranged&&f.cd<=0?f.c.reach*2.4:f.c.reach*.8;
  a.mv=d>want?dir:(d<f.c.reach*.45&&Math.random()<.4?-dir:0);
  if(o.st=='attack'&&d<o.c.reach+30&&Math.random()<.55*sk){a.blk=.35;a.mv=0}
  else if(d<f.c.reach*.95&&Math.random()<.8*sk)inp.atk=.2;
  if(shots.some(s=>s.o!=f&&Math.abs(s.x-f.x)<170)&&Math.random()<.5*sk){if(Math.random()<.5)inp.u=1;else a.blk=.4}
  if(fx.some(e=>e.k=='roots'&&e.o!=f&&!e.done)&&Math.random()<.7*sk)inp.u=1;
  if(f.cd<=0&&Math.random()<.5*sk){const id=f.c.id;
    if(id=='pal'?f.hp<f.c.hp*.75:id=='dwarf'?d<300:id=='tief'?d<330:true)inp.sp=.3}
  if(Math.random()<.04)inp.u=1;
  inp.l=a.mv<0;inp.r=a.mv>0}
function step(dt){
  T+=dt;pt+=dt;shake*=.85;
  txt=txt.filter(t=>(t.t+=dt)<.9);
  if(phase=='intro'){if(pt>1.9){phase='fight';beep(660,.3,'square',.1)}}
  if(phase=='fight'){timer-=dt;if(timer<=0){timer=0;const a=F[0].hp/F[0].c.hp,b=F[1].hp/F[1].c.hp;const l=a==b?null:F[a<b?0:1];if(l){l.ko=.001;l.hp=0}endRound()}}
  if(phase=='ko'&&pt>2.4){const k0=F[0].ko>0,k1=F[1].ko>0;if(k0&&!k1)wins[1]++;else if(k1&&!k0)wins[0]++;
    if(wins[0]>=2||wins[1]>=2||round>=5){finish()}else{round++;startRound()}return}
  for(const f of F){const o=F[1-f.i],c=f.c,inp=f.in;
    f.cd=Math.max(0,f.cd-dt);f.slow=Math.max(0,f.slow-dt);f.stun=Math.max(0,f.stun-dt);f.shield=Math.max(0,f.shield-dt);f.hit=Math.max(0,f.hit-dt);
    if(f.ko){f.ko+=dt}
    else if(phase=='fight'){
      if(f.cpu)cpu(f,dt);
      const free=f.hit<=0&&f.stun<=0&&f.st!='attack'&&f.spin<=0&&!f.slam;
      const sp=c.spd*(f.slow>0?.5:1);
      f.blocking=free&&inp.block&&f.y==0;
      if(free){if(f.y==0)f.face=o.x>=f.x?1:-1;
        const mv=(inp.r?1:0)-(inp.l?1:0);
        f.vx=f.blocking?0:mv*sp;
        if(inp.u&&f.y==0&&!f.blocking){f.vy=-610;beep(380,.08,'sine',.05)}
        if(inp.sp>0&&f.cd<=0&&!f.blocking){inp.sp=0;f.cast=.4;special(f)}
        else if(inp.atk>0&&!f.blocking){inp.atk=0;f.st='attack';f.at=0;f.did=0;beep(240,.07,'square',.05)}
      }else if(f.y==0&&f.spin<=0)f.vx*=.8;
      if(f.st=='attack'){f.at+=dt;if(f.y==0)f.vx*=.7;
        if(!f.did&&f.at>c.at*.4){f.did=1;const dx=(o.x-f.x)*f.face;if(dx>-25&&dx<c.reach&&Math.abs(o.y-f.y)<115)hurt(o,c.dmg,230,f.face)}
        if(f.at>=c.at)f.st='idle'}
      if(f.spin>0){f.spin-=dt;f.vx=f.spinDir*440;f.spinHit-=dt;
        if(f.spinHit<=0&&Math.abs(o.x-f.x)<95&&Math.abs(o.y-f.y)<110){hurt(o,6,120,f.spinDir);f.spinHit=.24}}
    }else{f.vx*=.8;f.blocking=0}
    inp.atk=Math.max(0,inp.atk-dt);inp.sp=Math.max(0,inp.sp-dt);f.cast=Math.max(0,f.cast-dt);if(!f.cpu)inp.u=inp.uh||0;
    f.vy+=1500*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;
    if(f.y>=0){if(f.slam&&f.vy>0){f.slam=0;f.vx=0;shake=10;beep(70,.35,'sawtooth',.14);fx.push({k:'ring',x:f.x,t:0,col:c.col});
        if(Math.abs(o.x-f.x)<215&&o.y>-45)hurt(o,20,480,Math.sign(o.x-f.x)||f.face,{pop:420})}
      f.y=0;f.vy=0;if(f.ko)f.vx*=.9}
    f.x=Math.max(48,Math.min(W-48,f.x));
  }
  const a=F[0],b=F[1];
  if(!a.ko&&!b.ko&&Math.abs(a.y-b.y)<80){const d=b.x-a.x,m=62-Math.abs(d);if(m>0){const s=(d>=0?1:-1)*m/2;a.x-=s;b.x+=s;a.x=Math.max(48,Math.min(W-48,a.x));b.x=Math.max(48,Math.min(W-48,b.x))}}
  for(const s of shots){const t=F[1-s.o.i];s.life-=dt;
    if(s.k=='potion'){s.vy+=1250*dt;if(s.y>=GY-6){s.life=0;fx.push({k:'pool',x:s.x,t:0,o:s.o,tick:0});beep(200,.2,'sine',.08);continue}}
    if(s.k=='raven'){const ty=GY+t.y-t.c.h*.6,ang=Math.atan2(ty-s.y,t.x-s.x);s.vx+=(Math.cos(ang)*350-s.vx)*Math.min(1,dt*4);s.vy+=(Math.sin(ang)*350-s.vy)*Math.min(1,dt*4)}
    s.x+=s.vx*dt;s.y+=s.vy*dt;if(s.x<-40||s.x>W+40)s.life=0;
    const ty=GY+t.y-t.c.h*.5;
    if(s.life>0&&!t.ko&&(!s.ground||t.y>-45)&&Math.abs(s.x-t.x)<s.r+30&&(s.ground||Math.abs(s.y-ty)<t.c.h*.5+s.r)){s.life=0;const dir=Math.sign(s.vx)||1;
      if(s.k=='wave'){if(hurt(t,10,160,dir))t.slow=3}
      else if(s.k=='potion')hurt(t,8,120,dir);
      else if(s.k=='croc')hurt(t,16,260,dir,{pop:260});
      else if(s.k=='raven'){if(hurt(t,14,140,dir))t.hit=.45}
      else if(s.k=='die'){if(s.n==20)say(t.x,GY-t.c.h-40,'Natural 20!','#f2d16b',1);hurt(t,s.n==20?40:5+s.n,s.n==20?520:200,dir,s.n==20?{pop:380}:{})}}}
  shots=shots.filter(s=>s.life>0);
  for(const e of fx){e.t+=dt;const t=e.o?F[1-e.o.i]:null;
    if(e.k=='roots'&&!e.done&&e.t>.6){e.done=1;beep(110,.3,'sawtooth',.1);if(Math.abs(t.x-e.x)<62&&t.y>-40){if(hurt(t,12,0,1,{unblock:1})){t.stun=1.6;t.hit=0;t.vx=0}}}
    if(e.k=='pool'){e.tick-=dt;if(e.tick<=0&&Math.abs(t.x-e.x)<80&&t.y>-20&&!t.ko){e.tick=.5;hurt(t,4,0,1,{nostun:1,unblock:1})}}}
  fx=fx.filter(e=>e.t<({spark:.25,ring:.5,roots:2.3,pool:4})[e.k]);
}
function finish(){phase='over';const w=wins[0]==wins[1]?-1:(wins[0]>wins[1]?0:1);$('#quit').hidden=true;
  $('#endimg').src=SPR[CH[pick[w<0?0:w]].id+'_front'];
  $('#endtxt').textContent=w<0?'Draw':(mode==1?(w==0?'You win':'CPU wins'):('Player '+(w+1)+' wins'))+' with '+CH[pick[w<0?0:w]].name;
  if(w<0)$('#endtxt').textContent='Draw';$('#end').hidden=false}

/* ---------- drawing ---------- */
function d20(x,y,r,rot,col,a){g.save();g.translate(x,y);g.rotate(rot);g.globalAlpha=a;g.strokeStyle=col;g.lineWidth=2;g.beginPath();
  for(let i=0;i<6;i++){const an=i*Math.PI/3;g[i?'lineTo':'moveTo'](Math.cos(an)*r,Math.sin(an)*r)}g.closePath();
  for(let i=0;i<3;i++){const an=i*2*Math.PI/3-Math.PI/2;g[i?'lineTo':'moveTo'](Math.cos(an)*r*.55,Math.sin(an)*r*.55)}g.closePath();
  for(let i=0;i<3;i++){const an=i*2*Math.PI/3-Math.PI/2;g.moveTo(Math.cos(an)*r*.55,Math.sin(an)*r*.55);g.lineTo(Math.cos(an)*r,Math.sin(an)*r)}g.stroke();g.restore()}
function scene(){
  let gr=g.createLinearGradient(0,0,0,GY);gr.addColorStop(0,'#0b1512');gr.addColorStop(1,'#1f4033');g.fillStyle=gr;g.fillRect(0,0,W,GY);
  gr=g.createRadialGradient(W/2,GY-60,20,W/2,GY-60,520);gr.addColorStop(0,'rgba(224,170,62,.22)');gr.addColorStop(1,'rgba(224,170,62,0)');g.fillStyle=gr;g.fillRect(0,0,W,GY);
  d20(150,250,120,.3,'#e0aa3e',.13);d20(800,280,150,-.2,'#8a4bb3',.16);d20(520,330,70,.9,'#efe2c2',.08);
  g.fillStyle='#0b1512';g.fillRect(40,300,34,GY-300);g.fillRect(W-90,260,34,GY-260); // pencils on the table
  g.fillStyle='#e0aa3e';g.fillRect(40,300,34,10);g.fillRect(W-90,260,34,10);
  g.fillStyle='#2b5a47';g.fillRect(0,GY-22,W,H-GY+22);
  g.strokeStyle='rgba(239,226,194,.16)';g.lineWidth=1;g.beginPath();
  for(let i=-12;i<=12;i++){g.moveTo(W/2+i*52,GY-22);g.lineTo(W/2+i*96,H)}
  for(const y of [GY-22,GY-6,GY+16,GY+46])g.moveTo(0,y),g.lineTo(W,y);g.stroke();
}
function fighter(f){const c=f.c,img=f.img,s=c.h/340,w=img.width*s,nf=c.fl?-1:1;let rot=0,ox=0,sy=1,sx=1,al=1;
  const gy=GY+f.y;
  g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(f.x,GY+4,w*.42*(1+f.y/600),9,0,0,7);g.fill();
  if(f.ko){rot=-f.face*Math.min(1.45,f.ko*5)}
  else if(f.hit>0){rot=-f.face*.2;al=Math.floor(T*30)%2?.55:1}
  else if(f.st=='attack'){const p=Math.sin(Math.min(1,f.at/c.at)*Math.PI);ox=f.face*p*26;rot=f.face*p*.22}
  else if(f.slam){rot=f.face*.5}

  if(f.blocking){rot=-f.face*.08;sy=.95}

  const R=f.rig,ph=f.x/20,walking=f.y==0&&Math.abs(f.vx)>20&&!f.ko&&f.hit<=0;
  let legA=0,armA=Math.sin(T*2+f.i)*.05,hop=0,tuck=0;
  if(walking){legA=Math.sin(ph)*.42;armA=Math.sin(ph)*.16;hop=-Math.abs(Math.sin(ph))*(R.hop?12:4)}
  if(f.y<0&&!f.ko){tuck=.45;armA=-.35*R.sw}
  if(f.st=='attack'){const p=f.at/c.at;armA=R.amp*R.sw*(p<.35?-.7*p/.35:p<.6?-.7+1.9*(p-.35)/.25:1.2*(1-(p-.6)/.4))}

    const part=(px,py,ang,path,im)=>{g.save();g.translate(px,py);g.rotate(ang);g.translate(-px,-py);g.beginPath();path();g.clip();g.drawImage(im||img,0,0);g.restore()};
    if(R.legs){const[x0,sp,x1]=R.legs,hy=R.hip;

    g.arc(f.x+f.face*c.reach*.35,cy,c.reach*.6,f.face>0?-1:Math.PI-1,f.face>0?1:Math.PI+1,false);g.stroke()}
  if(f.spin>0){g.strokeStyle=c.col;g.lineWidth=4;g.beginPath();g.ellipse(f.x,cy+10,80,22,0,T*20%6.28,T*20%6.28+4);g.stroke()}
  if(f.shield>0){g.strokeStyle='#f2d16b';g.fillStyle='rgba(242,209,107,.18)';g.lineWidth=4;g.beginPath();g.ellipse(f.x,cy,c.h*.48,c.h*.62,0,0,7);g.fill();g.stroke()}
  if(f.blocking){g.strokeStyle='rgba(239,226,194,.8)';g.lineWidth=5;g.beginPath();g.arc(f.x+f.face*20,cy,c.h*.4,f.face>0?-1.1:Math.PI-1.1,f.face>0?1.1:Math.PI+1.1);g.stroke()}
  if(f.slow>0){g.fillStyle='#b78be0';g.font='700 22px serif';for(let i=0;i<3;i++)g.fillText('♪',f.x-30+i*26,gy-c.h-6-((T*40+i*13)%26))}
  if(f.stun>0){g.strokeStyle='#4f8a3a';g.lineWidth=7;g.lineCap='round';for(let i=-2;i<=2;i++){g.beginPath();g.moveTo(f.x+i*16,GY+4);g.quadraticCurveTo(f.x+i*26,GY-40,f.x+i*9+Math.sin(T*8+i)*4,GY-70-Math.abs(i)*-8);g.stroke()}}
}
function hud(){
  for(const f of F){const L=f.i==0,x=L?20:W-20,bw=360,dir=L?1:-1,c=f.c,pi=IMG[c.id+'_front'];
    g.fillStyle='#0b1512';g.fillRect(L?x+54:x-54-bw,22,bw,22);
    const p=f.hp/c.hp;g.fillStyle=p>.5?'#7fc65b':p>.25?'#e0aa3e':'#d2492f';g.fillRect(L?x+54:x-54-bw*p,22,bw*p,22);
    g.strokeStyle='#efe2c2';g.lineWidth=2;g.strokeRect(L?x+54:x-54-bw,22,bw,22);
    const cw=150,cp=1-f.cd/c.cd;g.fillStyle='#0b1512';g.fillRect(L?x+54:x-54-cw,50,cw,8);g.fillStyle=cp>=1?(Math.floor(T*4)%2?'#e3c8f5':c.col):'#5d3a78';g.fillRect(L?x+54:x-54-cw*cp,50,cw*cp,8);
    g.font="700 11px 'Alegreya Sans',sans-serif";g.textAlign=L?'left':'right';g.fillStyle=cp>=1?'#e3c8f5':'#b9ad8f';g.fillText(cp>=1?'POWER READY':'POWER',L?x+54:x-54,71);
    g.save();g.beginPath();g.arc(x+dir*24,40,26,0,7);g.fillStyle='#24483b';g.fill();g.clip();
    if(pi.complete&&pi.width){const s=120/pi.height;g.drawImage(pi,x+dir*24-pi.width*s/2,12,pi.width*s,120)}g.restore();
    g.strokeStyle=L?'#e0aa3e':'#d2492f';g.lineWidth=3;g.beginPath();g.arc(x+dir*24,40,26,0,7);g.stroke();
    g.fillStyle='#efe2c2';g.font="600 20px 'Grenze Gotisch',Georgia,serif";g.textAlign=L?'left':'right';g.fillText(c.name,L?x+212:x-212,62,210);
    g.font="700 13px 'Alegreya Sans',sans-serif";g.fillStyle='#0b1512';g.fillText(Math.ceil(f.hp)+' HP',L?x+60:x-60,38);
    for(let k=0;k<2;k++){g.beginPath();g.arc(L?W/2-58-k*20:W/2+58+k*20,33,7,0,7);g.fillStyle=k<wins[f.i]?'#e0aa3e':'#0b1512';g.fill();g.strokeStyle='#efe2c2';g.lineWidth=1.5;g.stroke()}
  }
  g.textAlign='center';g.fillStyle='#efe2c2';g.font="800 40px 'Grenze Gotisch',Georgia,serif";g.fillText(Math.ceil(timer),W/2,48);
}
function draw(){
  g.save();if(shake>.5)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  scene();
  for(const e of fx){
    if(e.k=='pool'){const a=Math.min(1,(4-e.t)*2);g.fillStyle=`rgba(95,208,138,${.45*a})`;g.beginPath();g.ellipse(e.x,GY+6,80,12,0,0,7);g.fill();
      g.fillStyle=`rgba(160,240,180,${.7*a})`;for(let i=0;i<5;i++){const yy=(T*50+i*17)%50;g.beginPath();g.arc(e.x-60+i*30,GY-yy,4-yy/16,0,7);g.fill()}}
    if(e.k=='roots'&&!e.done){g.strokeStyle='rgba(111,174,79,.9)';g.lineWidth=3;g.setLineDash([6,6]);g.beginPath();g.ellipse(e.x,GY+6,62*(e.t/.6),10,0,0,7);g.stroke();g.setLineDash([])}
    if(e.k=='roots'&&e.done&&e.t<1){g.strokeStyle='#4f8a3a';g.lineWidth=6;g.lineCap='round';for(let i=-2;i<=2;i++){g.beginPath();g.moveTo(e.x+i*20,GY+6);g.lineTo(e.x+i*24,GY-50*Math.min(1,(e.t-.6)*8)*(1-Math.max(0,e.t-.8)*5));g.stroke()}}
  }
  (F[0].st=='attack'?[F[1],F[0]]:F).forEach(fighter);
  for(const e of fx){
    if(e.k=='spark'){g.strokeStyle=e.col;g.lineWidth=4;g.lineCap='round';for(let i=0;i<7;i++){const an=i*.9,r1=8+e.t*120,r2=r1+16;g.beginPath();g.moveTo(e.x+Math.cos(an)*r1,e.y+Math.sin(an)*r1);g.lineTo(e.x+Math.cos(an)*r2,e.y+Math.sin(an)*r2);g.stroke()}}
    if(e.k=='ring'){g.strokeStyle=e.col;g.globalAlpha=1-e.t*2;g.lineWidth=8;g.beginPath();g.ellipse(e.x,GY+4,e.t*430,e.t*60,0,0,7);g.stroke();g.globalAlpha=1}}
  for(const s of shots){g.save();g.translate(s.x,s.y);
    if(s.k=='wave'){g.strokeStyle='#c79bf0';g.lineWidth=5;g.lineCap='round';const d=Math.sign(s.vx);for(let i=0;i<3;i++){g.globalAlpha=1-i*.28;g.beginPath();g.arc(-d*i*16,0,24-i*2,d>0?-1:Math.PI-1,d>0?1:Math.PI+1);g.stroke()}g.fillStyle='#e3c8f5';g.globalAlpha=1;g.font='700 24px serif';g.fillText('♫',-d*60,Math.sin(T*14)*10)}
    else if(s.k=='potion'){g.rotate(T*10);g.fillStyle='#8a4bb3';g.beginPath();g.arc(0,4,13,0,7);g.fill();g.fillRect(-5,-16,10,12);g.fillStyle='#b98a5a';g.fillRect(-6,-21,12,6)}
    else if(s.k=='raven'){g.scale(Math.sign(s.vx)||1,1);const fl=Math.sin(T*26)*14;g.fillStyle='#17141c';g.beginPath();g.ellipse(0,0,20,10,0,0,7);g.fill();
      g.beginPath();g.moveTo(-8,0);g.lineTo(-2,-8-fl);g.lineTo(10,0);g.fill();g.beginPath();g.moveTo(-18,0);g.lineTo(-34,-5);g.lineTo(-32,6);g.fill();
      g.beginPath();g.arc(18,-5,8,0,7);g.fill();g.fillStyle='#e0aa3e';g.beginPath();g.moveTo(24,-7);g.lineTo(36,-3);g.lineTo(24,-1);g.fill()}
    else if(s.k=='croc'){g.scale(Math.sign(s.vx)||1,1);const jaw=Math.abs(Math.sin(T*14))*.5,wg=Math.sin(T*18)*6;
      g.fillStyle='#3f7a3a';g.beginPath();g.ellipse(-8,0,34,11,0,0,7);g.fill();
      g.beginPath();g.moveTo(-36,-6);g.quadraticCurveTo(-62,wg,-84,wg-4);g.quadraticCurveTo(-60,wg+10,-36,8);g.fill();
      g.fillRect(-26,6,8,10+wg/2);g.fillRect(6,6,8,10-wg/2);
      g.save();g.translate(20,-2);g.rotate(-jaw);g.beginPath();g.moveTo(0,-8);g.lineTo(44,-4);g.lineTo(44,2);g.lineTo(0,2);g.fill();g.fillStyle='#efe2c2';for(let i=0;i<5;i++)g.fillRect(8+i*7,2,3,4);g.restore();
      g.fillStyle='#2f5f2c';g.save();g.translate(20,2);g.rotate(jaw*.5);g.beginPath();g.moveTo(0,0);g.lineTo(42,0);g.lineTo(40,6);g.lineTo(0,8);g.fill();g.restore();
      g.fillStyle='#f2d16b';g.beginPath();g.arc(18,-9,3.5,0,7);g.fill();g.fillStyle='#2f5f2c';for(let i=0;i<5;i++){g.beginPath();g.moveTo(-28+i*10,-10);g.lineTo(-23+i*10,-17);g.lineTo(-18+i*10,-10);g.fill()}}
    else if(s.k=='die'){g.rotate(T*12);g.fillStyle=s.n==20?'#f2d16b':'#efe2c2';g.beginPath();for(let i=0;i<6;i++){const an=i*Math.PI/3;g[i?'lineTo':'moveTo'](Math.cos(an)*22,Math.sin(an)*22)}g.fill();g.strokeStyle='#5a2d12';g.lineWidth=2;g.stroke();
      g.rotate(-T*12);g.fillStyle='#5a2d12';g.font="700 18px 'Alegreya Sans',sans-serif";g.textAlign='center';g.fillText(s.n,0,6)}
    g.restore()}
  g.textAlign='center';
  for(const t of txt){g.globalAlpha=1-Math.max(0,t.t-.5)*2.5;g.font=`800 ${t.big?34:24}px 'Grenze Gotisch',Georgia,serif`;g.lineWidth=4;g.strokeStyle='#0b1512';g.strokeText(t.s,t.x,t.y-t.t*50);g.fillStyle=t.col;g.fillText(t.s,t.x,t.y-t.t*50)}
  g.globalAlpha=1;g.restore();
  hud();
  let big='';if(phase=='intro')big=pt<1.2?'Round '+round:'Fight!';if(phase=='ko')big=timer<=0?'Time!':'Knockout!';
  if(big){g.font="800 96px 'Grenze Gotisch',Georgia,serif";g.lineWidth=10;g.strokeStyle='#5a2d12';g.strokeText(big,W/2,260);g.fillStyle='#e0aa3e';g.fillText(big,W/2,260)}
}

/* ---------- loop, sizing, input ---------- */
function fit(){const st=$('#stage'),aw=st.clientWidth,ah=st.clientHeight-( $('#legend').offsetHeight?$('#legend').offsetHeight+8:0);
  const w=Math.max(200,Math.min(aw,ah*16/9)),dpr=Math.min(2,window.devicePixelRatio||1);
  cv.style.width=w+'px';cv.style.height=w*9/16+'px';cv.width=Math.round(w*dpr);cv.height=Math.round(w*9/16*dpr)}
addEventListener('resize',fit);
let last=0;
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(.033,(ts-last)/1000||0);last=ts;
  if(phase=='menu'||phase=='over'||!F.length)return;
  step(dt);g.setTransform(cv.width/W,0,0,cv.height/H,0,0);draw()}
const KM={KeyA:[0,'l'],KeyD:[0,'r'],KeyW:[0,'u'],KeyS:[0,'block'],KeyF:[0,'atk'],KeyG:[0,'sp'],Space:[0,'atk'],
  ArrowLeft:[1,'l'],ArrowRight:[1,'r'],ArrowUp:[1,'u'],ArrowDown:[1,'block'],KeyK:[1,'atk'],KeyL:[1,'sp']};
function key(e,dn){let m=KM[e.code];if(!m||phase=='menu'||phase=='over')return;e.preventDefault();
  let[p,k]=m;if(mode==1)p=0;if(mode==1&&e.code=='KeyK')k='atk';
  set(p,k,dn,e.repeat)}
function set(p,k,dn,rep){const inp=F[p]?F[p].in:IN[p];
  if(k=='atk'||k=='sp'){if(dn&&!rep)inp[k]=k=='sp'?.45:.22}else if(k=='u'){inp.uh=dn;if(dn)inp.u=1}else inp[k]=dn?1:0}
addEventListener('keydown',e=>key(e,true));addEventListener('keyup',e=>key(e,false));
document.querySelectorAll('.tb').forEach(b=>{const k=b.dataset.k;
  const dn=e=>{e.preventDefault();b.classList.add('on');set(0,k,true)},up=e=>{e.preventDefault();b.classList.remove('on');set(0,k,false)};
  b.addEventListener('pointerdown',dn);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);
  b.addEventListener('contextmenu',e=>e.preventDefault())});
/* iPhone: stop double-tap and pinch zoom while playing */
const inPlay=()=>phase!='menu'&&phase!='over';
document.addEventListener('touchstart',e=>{if(e.touches.length>1||(inPlay()&&!e.target.closest('#quit')))e.preventDefault()},{passive:false});
let lastTE=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTE<350&&!e.target.closest('.pick,.slot,.seg,.go,.ghost,#quit'))e.preventDefault();lastTE=n},{passive:false});
document.addEventListener('touchmove',e=>{if(inPlay()||e.touches.length>1)e.preventDefault()},{passive:false});
['gesturestart','gesturechange','gestureend','dblclick'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
renderMenu();fit();requestAnimationFrame(loop);
}catch(e){var nb=document.getElementById("nojs");if(nb){nb.hidden=false;nb.textContent="The game hit an error while starting: "+(e&&e.message?e.message:e)}}})();
</script>
